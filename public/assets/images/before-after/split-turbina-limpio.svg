<svg viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
  <rect width="800" height="600" fill="#090d16"/>
  <!-- Dark background grid -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 8"/>
  <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Evaporator Coil Section (Upper) - Pristine / Clean Aluminum -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="600" height="150" rx="8" fill="#0c4a6e" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <!-- Clean Silver/Cyan Aluminum fins -->
    <path d="M 20 20 L 580 20 M 20 40 L 580 40 M 20 60 L 580 60 M 20 80 L 580 80 M 20 100 L 580 100 M 20 120 L 580 120" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pure airflow lines -->
    <path d="M 50 15 L 50 135 M 150 15 L 150 135 M 250 15 L 250 135 M 350 15 L 350 135 M 450 15 L 450 135 M 550 15 L 550 135" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="30" y="140" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="bold">SERPENTÍN DESINCRUSTADO | FLUJO DE AIRE 100% LIBRE</text>
  </g>

  <!-- Cross-Flow Fan Turbine (Turbina Transversal) - Sanitized and Clean -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="600" height="240" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <text x="25" y="35" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">TURBINA HIGIENIZADA A PRESIÓN CON DESINFECTANTE</text>

    <!-- Turbine Blades Cylindrical Array - Pristine Sharp Blades -->
    <g transform="translate(30, 50)">
      <path d="M 20 20 Q 35 70 20 120 M 50 20 Q 65 70 50 120 M 80 20 Q 95 70 80 120 M 110 20 Q 125 70 110 120 M 140 20 Q 155 70 140 120 M 170 20 Q 185 70 170 120 M 200 20 Q 215 70 200 120 M 230 20 Q 245 70 230 120 M 260 20 Q 275 70 260 120 M 290 20 Q 305 70 290 120 M 320 20 Q 335 70 320 120 M 350 20 Q 365 70 350 120 M 380 20 Q 395 70 380 120 M 410 20 Q 425 70 410 120 M 440 20 Q 455 70 440 120 M 470 20 Q 485 70 470 120 M 500 20 Q 515 70 500 120 M 530 20 Q 545 70 530 120" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
      <!-- Gleam highlights -->
      <circle cx="80" cy="70" r="3" fill="#ffffff"/>
      <circle cx="200" cy="65" r="3" fill="#ffffff"/>
      <circle cx="350" cy="75" r="3" fill="#ffffff"/>
      <circle cx="470" cy="60" r="3" fill="#ffffff"/>
    </g>

    <!-- Results Box -->
    <rect x="25" y="185" width="550" height="40" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8"/>
    <text x="35" y="210" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="12">RESULTADO: Aire puro sin bacterias, frío máximo inmediato, silencio total en cabina</text>
  </g>

  <!-- Status Watermark (Top Right) -->
  <g transform="translate(600, 30)">
    <rect x="0" y="0" width="170" height="32" rx="6" fill="#0369a1" stroke="#38bdf8"/>
    <text x="85" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">ESTADO: DESPUÉS</text>
  </g>
</svg>
