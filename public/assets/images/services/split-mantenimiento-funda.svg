<svg viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
  <rect width="600" height="450" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <!-- Wall grid -->
  <line x1="50" y1="0" x2="50" y2="450" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="550" y1="0" x2="550" y2="450" stroke="#1e293b" stroke-dasharray="4 4"/>
  
  <!-- Split Chassis -->
  <rect x="100" y="60" width="400" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="120" y="80" width="360" height="40" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="300" y="105" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SERPENTÍN Y TURBINA INTERIOR</text>
  
  <!-- Louver -->
  <rect x="120" y="160" width="360" height="15" rx="4" fill="#0b1120" stroke="#0284c7"/>
  
  <!-- Waterproof Collection Bag -->
  <path d="M 90 170 C 90 170, 70 290, 300 290 C 530 290, 510 170, 510 170 Z" fill="#0284c7" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="2"/>
  <path d="M 300 290 L 300 390" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Water bucket -->
  <rect x="260" y="380" width="80" height="50" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="300" y="410" fill="#a5f3fc" font-family="sans-serif" font-size="10" text-anchor="middle">RECOLECCIÓN</text>

  <!-- Technical Callout -->
  <rect x="360" y="220" width="180" height="30" rx="6" fill="#0b1120" stroke="#38bdf8"/>
  <text x="450" y="240" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PARED 100% PROTEGIDA</text>
</svg>
