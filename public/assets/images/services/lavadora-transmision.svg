<svg viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
  <rect width="600" height="450" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Washing Machine Chassis -->
  <rect x="180" y="50" width="240" height="340" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- Top Panel -->
  <rect x="200" y="70" width="200" height="40" rx="6" fill="#0b1120" stroke="#0ea5e9"/>
  <circle cx="230" cy="90" r="10" fill="#0284c7" stroke="#38bdf8"/>
  <rect x="300" y="82" width="80" height="16" rx="4" fill="#0369a1"/>
  
  <!-- Drum / Porthole -->
  <circle cx="300" cy="220" r="80" fill="#0b1120" stroke="#0ea5e9" stroke-width="3"/>
  <circle cx="300" cy="220" r="60" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Shock Absorbers / Springs (Suspensión) -->
  <line x1="210" y1="120" x2="230" y2="280" stroke="#ef4444" stroke-width="2"/>
  <line x1="390" y1="120" x2="370" y2="280" stroke="#ef4444" stroke-width="2"/>

  <!-- Protective floor mat callout -->
  <rect x="140" y="390" width="320" height="15" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8"/>
  <text x="300" y="402" fill="#e0f2fe" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">PROTECCIÓN DE PISO Y BALDOSA</text>

  <!-- Technical Callouts -->
  <rect x="40" y="190" width="120" height="45" rx="6" fill="#0b1120" stroke="#0ea5e9"/>
  <text x="100" y="210" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SUSPENSIÓN</text>
  <text x="100" y="224" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Cero Ruidos Fuertes</text>

  <rect x="440" y="260" width="130" height="45" rx="6" fill="#0b1120" stroke="#38bdf8"/>
  <text x="505" y="280" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BOMBA Y FILTRO</text>
  <text x="505" y="294" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Desagüe Inmediato</text>
</svg>
