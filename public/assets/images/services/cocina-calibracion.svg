<svg viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
  <rect width="600" height="450" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Cooktop Surface (Plancha de Cocina) -->
  <rect x="120" y="80" width="360" height="260" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Burner 1 (Left Large) with clean blue flame -->
  <g transform="translate(200, 160)">
    <circle cx="0" cy="0" r="40" fill="#0b1120" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="#1e293b" stroke="#38bdf8"/>
    <!-- Blue flame spikes -->
    <path d="M -30 -30 L 0 -45 L 30 -30 L 45 0 L 30 30 L 0 45 L -30 30 L -45 0 Z" stroke="#38bdf8" stroke-width="2" fill="#0284c7" fill-opacity="0.3"/>
  </g>

  <!-- Burner 2 (Right Medium) -->
  <g transform="translate(380, 160)">
    <circle cx="0" cy="0" r="30" fill="#0b1120" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8"/>
    <path d="M -22 -22 L 0 -35 L 22 -22 L 35 0 L 22 22 L 0 35 L -22 22 L -35 0 Z" stroke="#38bdf8" stroke-width="1.5" fill="#0284c7" fill-opacity="0.3"/>
  </g>

  <!-- Knobs (Perillas) -->
  <g transform="translate(210, 290)">
    <circle cx="0" cy="0" r="14" fill="#0b1120" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="60" cy="0" r="14" fill="#0b1120" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="120" cy="0" r="14" fill="#0b1120" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="180" cy="0" r="14" fill="#0b1120" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="0" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Technical Callouts -->
  <rect x="180" y="380" width="240" height="35" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8"/>
  <text x="300" y="402" fill="#e0f2fe" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LLAMA AZUL CALIBRADA | CERO TIZNE</text>
</svg>
