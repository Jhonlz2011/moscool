<svg viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
  <rect width="600" height="450" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Refrigerator Body -->
  <rect x="180" y="40" width="240" height="360" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- Freezer Upper Section -->
  <rect x="200" y="60" width="200" height="120" rx="8" fill="#0b1120" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="300" y="90" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CONGELADOR NO-FROST</text>
  <!-- Evaporator coils inside freezer -->
  <path d="M 220 120 Q 240 100 260 120 T 300 120 T 340 120 T 380 120" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 220 140 Q 240 120 260 140 T 300 140 T 340 140 T 380 140" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Lower Fresh Food Section -->
  <rect x="200" y="200" width="200" height="180" rx="8" fill="#0b1120" stroke="#64748b" stroke-width="1.5"/>
  <text x="300" y="230" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">REFRIGERADOR INFERIOR</text>
  <!-- Shelves -->
  <line x1="210" y1="260" x2="390" y2="260" stroke="#334155" stroke-width="2"/>
  <line x1="210" y1="310" x2="390" y2="310" stroke="#334155" stroke-width="2"/>

  <!-- Sensor & Damper Air Duct Callout -->
  <circle cx="300" cy="180" r="8" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/>
  <line x1="300" y1="180" x2="100" y2="180" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
  <rect x="40" y="160" width="120" height="40" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8"/>
  <text x="100" y="184" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">DUCTO Y SENSOR</text>

  <!-- Technical Callout Right -->
  <rect x="440" y="100" width="130" height="50" rx="6" fill="#0b1120" stroke="#0ea5e9"/>
  <text x="505" y="122" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">SISTEMA DE DESHIELO</text>
  <text x="505" y="138" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Resistencia y Bimetal</text>
</svg>
