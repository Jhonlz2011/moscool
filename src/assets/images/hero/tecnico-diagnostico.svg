<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c14" />
    </linearGradient>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect width="800" height="500" rx="16" fill="url(#techGrid)" />

  <!-- Split AC Unit Representation (Indoor) -->
  <g transform="translate(140, 70)">
    <!-- Wall backdrop -->
    <rect x="-40" y="-30" width="600" height="340" rx="12" fill="#111827" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4 4" />
    <text x="-25" y="-12" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">PARED RESIDENCIAL DE GYPSUM (SECA Y PROTEGIDA)</text>

    <!-- Split Unit Chassis -->
    <rect x="40" y="20" width="440" height="150" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Front panel seam -->
    <path d="M 50 60 L 470 60" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="8 4" />
    <!-- Louver flap (deflector de aire) -->
    <rect x="60" y="140" width="400" height="18" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <!-- Digital display on unit -->
    <rect x="400" y="40" width="48" height="24" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" />
    <text x="424" y="56" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" text-anchor="middle">21°C</text>

    <!-- Waterproof Service Bag (Funda Colectora) -->
    <path d="M 30 145 C 30 145, 20 280, 260 280 C 500 280, 490 145, 490 145 Z" fill="#0284c7" fill-opacity="0.18" stroke="#0ea5e9" stroke-width="2" />
    <!-- Drain hose leading down -->
    <path d="M 260 280 L 260 360" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" />
    <path d="M 260 280 L 260 360" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" />

    <!-- Technical Callout Badges -->
    <g transform="translate(180, 210)">
      <rect x="0" y="0" width="160" height="28" rx="6" fill="#0f172a" stroke="#0ea5e9" />
      <text x="80" y="18" fill="#e0f2fe" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">FUNDA COLECTORA 100%</text>
    </g>
  </g>

  <!-- Diagnostic Instrument (Multímetro / Manifold Digital) -->
  <g transform="translate(480, 280)">
    <rect x="0" y="0" width="220" height="160" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <!-- Screen -->
    <rect x="20" y="20" width="180" height="60" rx="6" fill="#082f49" stroke="#0284c7" />
    <text x="35" y="45" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="bold">DIAGNÓSTICO EN SITIO</text>
    <text x="35" y="65" fill="#a5f3fc" font-family="ui-monospace, monospace" font-size="11">CONSUMO: 4.8A NOMINAL</text>

    <!-- Test probes (Cables de prueba) -->
    <path d="M 60 160 C 60 190, 40 210, -80 180" fill="none" stroke="#ef4444" stroke-width="3" />
    <path d="M 120 160 C 120 200, 100 220, -50 190" fill="none" stroke="#0ea5e9" stroke-width="3" />
  </g>

  <!-- Verified Badge -->
  <g transform="translate(40, 420)">
    <rect x="0" y="0" width="280" height="40" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="24" cy="20" r="10" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" />
    <text x="44" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">INSPECCIÓN SIN MANCHAS EN PARED</text>
  </g>
</svg>
