<svg viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
  <rect width="600" height="450" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Digital Manifold Gauge Body -->
  <g transform="translate(180, 60)">
    <rect x="0" y="0" width="240" height="260" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- Screen -->
    <rect x="30" y="30" width="180" height="100" rx="8" fill="#082f49" stroke="#0ea5e9"/>
    <text x="120" y="65" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="20" font-weight="bold" text-anchor="middle">120 PSI</text>
    <text x="120" y="90" fill="#a5f3fc" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">PRESIÓN NOMINAL ESTABLE</text>
    <text x="120" y="110" fill="#34d399" font-family="ui-monospace, monospace" font-size="10" font-weight="bold" text-anchor="middle">ESTADO: SIN FUGAS</text>

    <!-- Brass valves at bottom -->
    <circle cx="50" cy="200" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="190" cy="200" r="22" fill="#ef4444" stroke="#f87171" stroke-width="2"/>

    <!-- Service Hoses -->
    <path d="M 50 220 L 50 360" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <path d="M 120 220 L 120 360" stroke="#eab308" stroke-width="6" stroke-linecap="round"/>
    <path d="M 190 220 L 190 360" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Technical Badge -->
  <rect x="150" y="380" width="300" height="36" rx="8" fill="#0b1120" stroke="#38bdf8"/>
  <text x="300" y="403" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MEDICIÓN EXACTA SIN COBROS INVENTADOS</text>
</svg>
